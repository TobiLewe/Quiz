<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fragen & Antworten</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Fragen & Antworten</h1>

    <div class="quiz-buttons">
      <button class="quiz-button active" data-quiz="0">Quiz 1</button>
      <button class="quiz-button" data-quiz="1">Quiz 2</button>
      <button class="quiz-button" data-quiz="2">Quiz 3</button>
    </div>

    <section class="card">
      <div class="counter" id="counter">Frage 1 von 13</div>
      <div class="question" id="question"></div>

      <button id="answerButton" type="button">Antwort anzeigen</button>

      <div class="answer hidden" id="answer"></div>

      <button class="next hidden" id="nextButton" type="button">Nächste Frage</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
